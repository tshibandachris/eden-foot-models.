name: Audit forecasts
on:
  push:
    branches: [audit/forecast-evaluation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Résultats
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python audit/fetch_audit_results.py data/prospective_forecasts.jsonl audit/results.jsonl
      - name: Audit
        run: python audit/forecast_audit.py data/prospective_forecasts.jsonl audit/results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit/results.jsonl
