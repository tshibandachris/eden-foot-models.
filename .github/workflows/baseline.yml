name: Eden-foot baseline

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script à lancer"
        default: "eden_foot_v2.py"
        type: choice
        options:
          - eden_foot_v2.py
          - eden_foot_baseline.py
      league:
        description: "Code ligue (E0, SP1, D1, I1, F1)"
        default: "E0"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u "${{ github.event.inputs.script }}" --league "${{ github.event.inputs.league }}" | tee resultats.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resultats
          path: resultats.txt
