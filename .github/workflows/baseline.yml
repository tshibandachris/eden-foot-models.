name: Eden-foot baseline
run-name: "Eden-foot ${{ inputs.script }} | ${{ inputs.league }} | ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script à lancer"
        type: choice
        required: true
        default: "eden_foot_v4-1.py"
        options:
          - eden_foot_baseline.py
          - eden_foot_v4-1.py
          - eden_foot_v3-1.py
          - eden_foot_v2-1.py
      league:
        description: "Code ligue (E0, E1, SP1, D1, I1, F1)"
        type: choice
        required: true
        default: "E0"
        options:
          - E0
          - E1
          - SP1
          - D1
          - I1
          - F1

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m py_compile eden_foot_baseline.py eden_foot_v2-1.py eden_foot_v3-1.py eden_foot_v4-1.py
      - name: Exécuter le modèle choisi
        run: python -u "${{ inputs.script }}" --league "${{ inputs.league }}" | tee resultats.txt
      - name: Conserver les résultats
        uses: actions/upload-artifact@v4
        with:
          name: resultats-${{ inputs.script }}-${{ inputs.league }}
          path: resultats.txt
