name: Eden-foot v5.3 temporal audit + rolling evaluation snapshots

on:
  push:
    branches:
      - main
      - fix/v5-3-rigorous-evaluation
      - audit/leakage-calibration-holdout
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly snapshot; scheduled workflows run from the default branch.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: eden-foot-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protocol-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile v2-v5 modules and check calibration fix
        run: python -m py_compile eden_foot_v2.py eden_foot_v3.py eden_foot_v4.py eden_foot_v5.py eden_foot_prediction_ledger.py eden_foot_fixtures.py
      - name: Test leakage invariance and outcome calibration
        run: python -m pytest -q tests/test_v5_3_protocol.py tests/test_prospective_prediction_ledger.py tests/test_eden_foot_fixtures.py
      - name: Verify baseline remains unchanged
        shell: bash
        run: |
          actual="$(git rev-parse HEAD:eden_foot_baseline.py)"
          expected="6aaf542da01ee095fd0a0525c1860d975c23a31e"
          echo "Baseline Git blob SHA: $actual"
          test "$actual" = "$expected"

      - name: Execute walk-forward evaluation on E0
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Eden-foot evaluation snapshot"
            echo "UTC timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Git commit: $(git rev-parse HEAD)"
            echo "Trigger: ${{ github.event_name }}"
            echo
            python -u eden_foot_v5.py --league E0 --test-seasons 2 --holdout-seasons 2
          } 2>&1 | tee resultats-v5.3-E0.txt
      - name: Add snapshot metadata to workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Eden-foot rolling evaluation snapshot"
            echo "- UTC timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Baseline file: protected by Git blob SHA check"
            echo "- Full console log: attached as a workflow artifact"
            echo
            echo "Important: recurring snapshots are monitoring records, not proof of prospective superiority. Do not tune models against the reserved holdout; confirm any change on later unseen matches."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish rolling evaluation snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-foot-v5-3-E0-snapshot-run-${{ github.run_number }}
          path: resultats-v5.3-E0.txt
          if-no-files-found: warn
          retention-days: 90
