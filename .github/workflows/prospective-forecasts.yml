name: Eden-foot daily prospective forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: eden-foot-prospective-ledger
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Require football-data.org API token
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          if [ -z "$FOOTBALL_DATA_API_TOKEN" ]; then
            echo "::error::Add FOOTBALL_DATA_API_TOKEN in GitHub repository Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Fetch upcoming fixtures
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python eden_foot_fixtures.py --days 7 --competitions PL,PD,SA,BL1,FL1 --output data/upcoming_fixtures.jsonl

      - name: Persist immutable fixture snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upcoming_fixtures.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh upcoming fixture snapshot"
            git push origin HEAD:main
          else
            echo "Fixture snapshot unchanged."
          fi

      - name: Inspect Bundesliga team names
        run: |
          python - <<'PY'
          import glob
          import pandas as pd

          for path in sorted(glob.glob("**/D1.csv", recursive=True)):
              try:
                  df = pd.read_csv(path, encoding="utf-8-sig")
                  columns = [c for c in ("HomeTeam", "AwayTeam") if c in df.columns]

                  print(f"\n--- {path} ---")
                  if not columns:
                      print("Colonnes HomeTeam/AwayTeam absentes")
                      print("Colonnes disponibles :", df.columns.tolist())
                      continue

                  for col in columns:
                      names = sorted(df[col].dropna().astype(str).unique())
                      print(f"{col}:")
                      for name in names:
                          if "mainz" in name.lower():
                              print(f"  {name}")
              except Exception as exc:
                  print(f"Erreur de lecture {path}: {exc}")
          PY

      - name: Generate and record prospective forecasts
        run: |
          python eden_foot_prospective_predictor.py \
            --fixtures data/upcoming_fixtures.jsonl \
            --aliases data/team_aliases.json \
            --ledger data/prospective_forecasts.jsonl

      - name: Persist append-only forecast ledger
        run: |
          git add data/prospective_forecasts.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "data: append prospective forecasts"
            git push origin HEAD:main
          else
            echo "No new forecast records to persist."
          fi

      - name: Run historical nomenclature check
        run: python check_history.py
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Eden-foot prospective pipeline"
            echo "- UTC run time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Fixture ingestion: attempted; inspect prior step for result."
            echo "- Forecast model: experimental weighted Poisson candidate."
            echo "- Team names use explicit aliases first, then unique conservative normalization; ambiguous/unknown names fail safely."
            echo "- Ledger: append-only; duplicate fixture/model/version records are rejected."
            echo "- Scientific status: no superiority over market odds is claimed."
          } >> "$GITHUB_STEP_SUMMARY"

          
